<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <!-- Gradiente para el cono trasero/cilindro pequeño -->
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73797f" />
      <stop offset="50%" stop-color="#4e5358" />
      <stop offset="100%" stop-color="#2c3034" />
    </linearGradient>

    <!-- Gradiente para el cuerpo cónico principal -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f868d" />
      <stop offset="35%" stop-color="#9ea7af" />
      <stop offset="70%" stop-color="#565d63" />
      <stop offset="100%" stop-color="#33383c" />
    </linearGradient>

    <!-- Gradiente para el borde exterior del cono frontal -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b7177" />
      <stop offset="40%" stop-color="#464a4f" />
      <stop offset="80%" stop-color="#232629" />
      <stop offset="100%" stop-color="#111314" />
    </linearGradient>

    <!-- Gradiente para la cavidad cónica interior oscura -->
    <radialGradient id="innerConeGrad" cx="40%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#383d42" />
      <stop offset="60%" stop-color="#1c1f21" />
      <stop offset="100%" stop-color="#0a0b0c" />
    </radialGradient>

    <!-- Gradiente para la esfera/burbuja central flotante -->
    <radialGradient id="centerSphereGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#939da6" />
      <stop offset="45%" stop-color="#4c535a" />
      <stop offset="90%" stop-color="#141719" />
      <stop offset="100%" stop-color="#050607" />
    </radialGradient>
  </defs>

  <!-- Grupo del hardware del altavoz -->
  <g id="speaker-hardware" stroke="#181a1c" stroke-width="0.75" stroke-linejoin="round">
    <!-- Base cilíndrica trasera pequeña -->
    <path d="M 10,21 C 10,17.5 13,17.5 13,24 C 13,30.5 10,30.5 10,27 Z" fill="url(#backGrad)" />
    <ellipse cx="10" cy="24" rx="1.5" ry="3" fill="#2c3034" stroke="none" />

    <!-- Cuerpo intermedio cilíndrico/cónico -->
    <path d="M 10,19 C 10,19 18.5,16.5 18.5,24 C 18.5,31.5 10,29 10,29 Z" fill="url(#bodyGrad)" />
    
    <!-- Gran anillo o borde frontal -->
    <ellipse cx="21" cy="24" rx="6.5" ry="12.5" fill="url(#rimGrad)" />

    <!-- Cavidad cónica interior profunda -->
    <ellipse cx="21" cy="24" rx="5.2" ry="11" fill="url(#innerConeGrad)" stroke="none" />

    <!-- Esfera protuberante en el centro -->
    <ellipse cx="20.5" cy="24" rx="2.5" ry="4.8" fill="url(#centerSphereGrad)" stroke="#111314" stroke-width="0.5" />
  </g>

  <!-- Tres ondas de volumen negras a la derecha -->
  <g id="volume-waves" stroke="#1d2124" stroke-linecap="round" fill="none">
    <!-- Primera onda (pequeña y delgada) -->
    <path d="M 30,19 A 8.5,8.5 0 0,1 30,29" stroke-width="1.8" />
    
    <!-- Segunda onda (mediana) -->
    <path d="M 34,15 A 13.5,13.5 0 0,1 34,33" stroke-width="2.3" />
    
    <!-- Tercera onda (grande y gruesa) -->
    <path d="M 38,11 A 18.5,18.5 0 0,1 38,37" stroke-width="2.8" />
  </g>
</svg>
